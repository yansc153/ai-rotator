jobs:
  - id: "us_close_rotation"
    schedule: "0 6 * * *"
    script: "scripts/run_daily_rotation.py --market US"
  - id: "ah_close_rotation"
    schedule: "0 16 * * 1-5"
    script: "scripts/run_daily_rotation.py --market AH"
  - id: "morning_brief"
    schedule: "0 7 * * *"
    script: "scripts/send_discord_brief.py"
  - id: "weekly_rotation"
    schedule: "0 22 * * 0"
    script: "scripts/run_weekly_rotation.py"
  - id: "reviewer"
    schedule: "30 6 * * *"
    script: "scripts/run_reviewer.py"

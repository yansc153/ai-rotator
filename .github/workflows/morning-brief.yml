name: "Morning Brief 0900 CST"

on:
  schedule:
    - cron: "0 1 * * 1-5"   # 09:00 CST (UTC+8) = 01:00 UTC, Mon-Fri
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # extended: earnings 45s recovery + 43 tickers × 1.2s + retries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install yfinance akshare pandas pyyaml certifi requests

      - name: Create required directories
        run: mkdir -p data storage reports/daily

      - name: Fetch daily OHLCV (all 3357 stocks)
        run: cd scripts && python fetch_all_daily.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"

      - name: Score and screen candidates
        run: cd scripts && python screen_candidates.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"

      - name: Screen earnings plays (next 7 days)
        run: cd scripts && python fetch_earnings_plays.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"

      - name: Send morning Discord brief
        run: cd scripts && python send_discord_brief.py --session morning
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AI_ROTATOR_DB_PATH: storage/ai_rotator.db
          PYTHONUNBUFFERED: "1"

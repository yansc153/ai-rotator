name: "Midday Brief 1300 CST"

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

jobs:
  midday-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install yfinance akshare pandas pyyaml certifi requests
      - name: Create required directories
        run: mkdir -p data storage reports/daily
      - name: Fetch daily OHLCV
        run: cd scripts && python fetch_all_daily.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
      - name: Screen candidates
        run: cd scripts && python screen_candidates.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
      - name: Fetch intraday bars
        run: cd scripts && python fetch_intraday.py
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
      - name: Send midday Discord brief
        run: cd scripts && python send_discord_brief.py --session midday
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AI_ROTATOR_DB_PATH: storage/ai_rotator.db
          PYTHONUNBUFFERED: "1"
